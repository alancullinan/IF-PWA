<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Outfit', system-ui, sans-serif; }
    a { color: #FFB37A; } a:hover { color: #FFC79C; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #12142A; color: #EDEBFF; display: flex; flex-direction: column; box-sizing: border-box;">

  <div style="padding: 30px 24px 0;">
    <div style="font-size: 26px; font-weight: 500;">Settings</div>
  </div>

  <div style="padding: 24px 24px 0;">
    <div style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #8D8AC4;">Fasting plan</div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px;">
      <div style="background: #1A1D3C; border: 1px solid #1A1D3C; border-radius: 16px; padding: 14px 8px; text-align: center;">
        <div style="font-size: 17px; font-weight: 500;">12:12</div>
        <div style="font-size: 12px; color: #A9A6D8; margin-top: 3px;">12h fast</div>
      </div>
      <div style="background: #1A1D3C; border: 1px solid #1A1D3C; border-radius: 16px; padding: 14px 8px; text-align: center;">
        <div style="font-size: 17px; font-weight: 500;">14:10</div>
        <div style="font-size: 12px; color: #A9A6D8; margin-top: 3px;">14h fast</div>
      </div>
      <div style="background: #2A2A22; border: 1px solid #FFB37A; border-radius: 16px; padding: 14px 8px; text-align: center;">
        <div style="font-size: 17px; font-weight: 600; color: #FFB37A;">16:8</div>
        <div style="font-size: 12px; color: #FFB37A; margin-top: 3px;">16h fast</div>
      </div>
      <div style="background: #1A1D3C; border: 1px solid #1A1D3C; border-radius: 16px; padding: 14px 8px; text-align: center;">
        <div style="font-size: 17px; font-weight: 500;">18:6</div>
        <div style="font-size: 12px; color: #A9A6D8; margin-top: 3px;">18h fast</div>
      </div>
      <div style="background: #1A1D3C; border: 1px solid #1A1D3C; border-radius: 16px; padding: 14px 8px; text-align: center;">
        <div style="font-size: 17px; font-weight: 500;">20:4</div>
        <div style="font-size: 12px; color: #A9A6D8; margin-top: 3px;">20h fast</div>
      </div>
      <div style="background: #1A1D3C; border: 1px solid #1A1D3C; border-radius: 16px; padding: 14px 8px; text-align: center;">
        <div style="font-size: 17px; font-weight: 500;">OMAD</div>
        <div style="font-size: 12px; color: #A9A6D8; margin-top: 3px;">23h fast</div>
      </div>
    </div>

    <div style="background: #1A1D3C; border-radius: 16px; padding: 16px 18px; margin-top: 10px; display: flex; align-items: center; justify-content: space-between; min-height: 44px; box-sizing: border-box;">
      <div style="font-size: 16px;">Custom length</div>
      <div style="display: flex; align-items: center; gap: 8px; color: #A9A6D8;">
        <div style="font-size: 15px;">Off</div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
    </div>
  </div>

  <div style="padding: 26px 24px 0;">
    <div style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #8D8AC4;">Backup</div>

    <div style="background: #1A1D3C; border-radius: 20px; padding: 18px; margin-top: 14px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: flex-start; gap: 12px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFB37A" stroke-width="1.8" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1px;"><path d="M12 3v12M8 11l4 4 4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <div style="font-size: 15px;">Last backup 9 days ago</div>
          <div style="font-size: 13px; color: #A9A6D8; line-height: 1.4;">Save to Files or iCloud Drive &mdash; an export is the only copy that survives a new phone.</div>
        </div>
      </div>
      <button style="height: 50px; width: 100%; background: #FFB37A; color: #12142A; border: none; border-radius: 999px; font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer;">Export backup</button>
      <button style="height: 50px; width: 100%; background: transparent; color: #EDEBFF; border: 1px solid #2A2E58; border-radius: 999px; font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 500; cursor: pointer;">Import backup</button>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; justify-content: space-between; background: #1A1D3C; border-radius: 24px; padding: 12px 10px; margin: 0 24px 24px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 66px; color: #8D8AC4;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/></svg>
      <div style="font-size: 11px;">Timer</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 66px; color: #8D8AC4;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      <div style="font-size: 11px;">History</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 66px; color: #8D8AC4;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>
      <div style="font-size: 11px;">Stats</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 66px; color: #FFB37A;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>
      <div style="font-size: 11px;">Settings</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
