<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Outfit', system-ui, sans-serif; }
    a { color: #FFB37A; } a:hover { color: #FFC79C; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #12142A; color: #EDEBFF; display: flex; flex-direction: column; box-sizing: border-box; padding: 30px 24px 0;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <div style="font-size: 17px; font-weight: 500;">Evening fast</div>
    <div style="background: #1F2347; border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 500; color: #A9A6D8;">16:8</div>
  </div>

  <div style="display: flex; justify-content: center; margin-top: 36px;">
    <div style="position: relative; width: 268px; height: 268px;">
      <svg width="268" height="268" viewBox="0 0 240 240">
        <circle cx="120" cy="120" r="100" fill="none" stroke="#1D2043" stroke-width="18" stroke-linecap="round"/>
        <g transform="rotate(-90 120 120)">
          <circle cx="120" cy="120" r="100" fill="none" stroke="#FFB37A" stroke-width="18"
                  stroke-linecap="round" stroke-dasharray="528 628"/>
        </g>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
        <div style="font-size: 46px; font-weight: 300; letter-spacing: -0.02em;">13h 24m</div>
        <div style="font-size: 14px; color: #A9A6D8;">2h 36m to go</div>
      </div>
    </div>
  </div>

  <div style="margin-top: 34px; background: #1A1D3C; border-radius: 20px; padding: 18px 20px; display: flex; align-items: center; gap: 14px;">
    <div style="width: 42px; height: 42px; border-radius: 999px; background: #FFB37A; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12142A" stroke-width="2" stroke-linecap="round"><path d="M12 3v3M18.4 5.6l-2.1 2.1M21 12h-3M5.6 5.6l2.1 2.1M3 12h3"/><circle cx="12" cy="14" r="4"/></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 16px; font-weight: 500;">Burning fat</div>
      <div style="font-size: 13px; color: #A9A6D8;">Ketosis usually begins near 16h</div>
    </div>
  </div>

  <div style="display: flex; gap: 12px; margin-top: 14px;">
    <div style="flex-grow: 1; background: #1A1D3C; border-radius: 20px; padding: 16px 18px;">
      <div style="font-size: 13px; color: #A9A6D8;">Started</div>
      <div style="font-size: 19px; font-weight: 500; margin-top: 4px;">8:12 pm</div>
    </div>
    <div style="flex-grow: 1; background: #1A1D3C; border-radius: 20px; padding: 16px 18px;">
      <div style="font-size: 13px; color: #A9A6D8;">Ends</div>
      <div style="font-size: 19px; font-weight: 500; margin-top: 4px;">12:12 pm</div>
    </div>
  </div>

  <button style="margin-top: 24px; height: 58px; width: 100%; background: #FFB37A; color: #12142A; border: none; border-radius: 999px; font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer;">End fast</button>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; justify-content: space-between; background: #1A1D3C; border-radius: 24px; padding: 12px 10px; margin-bottom: 24px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 66px; color: #FFB37A;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/></svg>
      <div style="font-size: 11px;">Timer</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 66px; color: #6F6CA8;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      <div style="font-size: 11px;">History</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 66px; color: #6F6CA8;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>
      <div style="font-size: 11px;">Stats</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 66px; color: #6F6CA8;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>
      <div style="font-size: 11px;">Settings</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
