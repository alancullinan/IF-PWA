<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Space+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Archivo', system-ui, sans-serif; }
    a { color: #D9FF3D; } a:hover { color: #E8FF7A; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0B0B0B; color: #F2F0EA; display: flex; flex-direction: column; box-sizing: border-box;">

  <div style="background: #D9FF3D; color: #0B0B0B; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center;">
    <div style="font-weight: 800; font-size: 15px; letter-spacing: -0.02em; text-transform: uppercase;">Fasting</div>
    <div style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 14px;">16:8</div>
  </div>

  <div style="padding: 26px 20px 0;">
    <div style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #7A7A72;">Elapsed</div>
    <div style="font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 74px; line-height: 0.9; letter-spacing: -0.04em; margin-top: 6px;">13:24</div>
    <div style="font-family: 'Space Mono', monospace; font-size: 13px; color: #7A7A72; margin-top: 10px;">/ 16:00:00 TARGET</div>
  </div>

  <div style="margin-top: 24px; padding: 0 20px;">
    <div style="height: 44px; background: #17170F; display: flex;">
      <div style="width: 84%; background: #D9FF3D;"></div>
    </div>
    <div style="display: flex; justify-content: space-between; margin-top: 8px; font-family: 'Space Mono', monospace; font-size: 11px; color: #7A7A72;">
      <div>0H</div><div>4H</div><div>8H</div><div>12H</div><div>16H</div>
    </div>
  </div>

  <div style="margin-top: 26px; padding: 0 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px;">
    <div style="background: #17170F; padding: 16px;">
      <div style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #7A7A72;">STAGE</div>
      <div style="font-weight: 800; font-size: 19px; margin-top: 6px; text-transform: uppercase;">Lipolysis</div>
    </div>
    <div style="background: #17170F; padding: 16px;">
      <div style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #7A7A72;">STREAK</div>
      <div style="font-weight: 800; font-size: 19px; margin-top: 6px;">12 DAYS</div>
    </div>
    <div style="background: #17170F; padding: 16px;">
      <div style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #7A7A72;">STARTED</div>
      <div style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 19px; margin-top: 6px;">20:12</div>
    </div>
    <div style="background: #17170F; padding: 16px;">
      <div style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #7A7A72;">ENDS</div>
      <div style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 19px; margin-top: 6px;">12:12</div>
    </div>
  </div>

  <div style="padding: 24px 20px 0;">
    <button style="height: 60px; width: 100%; background: #D9FF3D; color: #0B0B0B; border: none; border-radius: 0; font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 17px; letter-spacing: 0.02em; text-transform: uppercase; cursor: pointer;">End fast</button>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 0 20px 24px;">
    <div style="background: #D9FF3D; color: #0B0B0B; padding: 14px 0; text-align: center; font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700;">TIME</div>
    <div style="background: #17170F; color: #7A7A72; padding: 14px 0; text-align: center; font-family: 'Space Mono', monospace; font-size: 11px;">HIST</div>
    <div style="background: #17170F; color: #7A7A72; padding: 14px 0; text-align: center; font-family: 'Space Mono', monospace; font-size: 11px;">STAT</div>
    <div style="background: #17170F; color: #7A7A72; padding: 14px 0; text-align: center; font-family: 'Space Mono', monospace; font-size: 11px;">SET</div>
  </div>

</div>
</x-dc>
</body>
</html>
