<!doctype html>
<html>

</head>
<body>
<x-dc>

    body { margin: 0; font-family: 'Outfit', system-ui, sans-serif; }
    a { color: #FFB37A; } a:hover { color: #FFC79C; }

</helmet>

<div style="width: 390px; height: 844px; background: #12142A; color: #EDEBFF; display: flex; flex-direction: column; box-sizing: border-box;">

  <div style="padding: 22px 24px 0; display: flex; flex-direction: column; gap: 10px; overflow: hidden;">

    <div style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #8D8AC4; margin-bottom: 2px;">September</div>

    <div style="background: #1A1D3C; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <div style="font-size: 22px; font-weight: 500;">16h 24m</div>
        <div style="background: #2A2A22; color: #FFB37A; border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 500;">Goal met</div>

        <div>Wed 3 Sep &middot; 20:12 &rarr; 12:36</div>
        <div style="color: #8D8AC4;">16:8</div>

    </div>

    <div style="background: #1A1D3C; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <div style="font-size: 22px; font-weight: 500;">14h 05m</div>
        <div style="background: #23264A; color: #A9A6D8; border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 500;">Short by 1h 55m</div>
      </div>
      <div style="height: 4px; background: #1D2043; border-radius: 2px; display: flex;">
        <div style="width: 88%; background: #8D8AC4; border-radius: 2px;"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #A9A6D8;">
        <div>Tue 2 Sep &middot; 21:40 &rarr; 11:45</div>
        <div style="color: #8D8AC4;">16:8</div>
      </div>
    </div>

    <div style="background: #1A1D3C; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <div style="font-size: 22px; font-weight: 500;">18h 30m</div>
        <div style="background: #2A2A22; color: #FFB37A; border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 500;">Goal met</div>
      </div>
      <div style="height: 4px; background: #1D2043; border-radius: 2px; display: flex;">
        <div style="width: 100%; background: #FFB37A; border-radius: 2px;"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #A9A6D8;">
        <div>Mon 1 Sep &middot; 19:55 &rarr; 14:25</div>
        <div style="color: #8D8AC4;">16:8</div>
      </div>
    </div>

    <div style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #8D8AC4; margin: 8px 0 2px;">August</div>

    <div style="background: #1A1D3C; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;">

        <div style="font-size: 22px; font-weight: 500;">16h 02m</div>
        <div style="background: #2A2A22; color: #FFB37A; border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 500;">Goal met</div>
      </div>
      <div style="height: 4px; background: #1D2043; border-radius: 2px; display: flex;">
        <div style="width: 100%; background: #FFB37A; border-radius: 2px;"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #A9A6D8;">

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; justify-content: space-between; background: #1A1D3C; border-radius: 24px; padding: 12px 10px; margin: 0 24px 24px;">

    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 66px; color: #8D8AC4;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>

    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 66px; color: #8D8AC4;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>
      <div style="font-size: 11px;">Settings</div>
    </div>
  </div>

</div>

</html>
